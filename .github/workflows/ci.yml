name: Research software checks
on: [push, pull_request]
permissions:
  contents: read
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        python: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install -e '.[dev,imaging]'
      - run: python -m pytest -q
      - run: python -m cancerlab benchmark --out /tmp/cancerlab-benchmark.json
      - name: Browser dependencies
        if: matrix.python == '3.13'
        run: python -m playwright install --with-deps chromium
      - name: Live browser regression
        if: matrix.python == '3.13'
        run: |
          python -m cancerlab serve >/tmp/cancerlab-server.log 2>&1 &
          python - <<'PY'
          import time, urllib.request
          for attempt in range(50):
              try:
                  urllib.request.urlopen('http://127.0.0.1:8765/api/health', timeout=1)
                  break
              except OSError:
                  time.sleep(.2)
          else:
              raise SystemExit('Server did not start')
          PY
          python scripts/browser_smoke.py --screenshots /tmp/cancerlab-screenshots
      - uses: actions/upload-artifact@v4
        if: matrix.python == '3.13' && always()
        with:
          name: synthetic-workspace-preview
          path: /tmp/cancerlab-screenshots
          if-no-files-found: ignore
